<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VRM Desktop Waifu</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        #chat-bubble {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            max-width: 400px; padding: 10px 15px; border-radius: 15px;
            background: rgba(255, 255, 255, 0.9); color: #333;
            font-family: "Microsoft YaHei", sans-serif; font-size: 14px;
            display: none; white-space: pre-wrap; word-wrap: break-word;
            pointer-events: none; /* 让点击穿透到3D模型 */
        }
    #affection-bar {
        position: fixed;
        top: 60px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 20px;
        color: #fff;
        font-family: "Microsoft YaHei", sans-serif;
        font-size: 13px;
        backdrop-filter: blur(6px);   
        user-select: none;
        pointer-events: none;
    }
    #affection-track {
        width: 100px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
    }
    #affection-fill {
        height: 100%;
        width: 20%;
        background: linear-gradient(90deg, #ff6b9d, #ff2d6f);
        border-radius: 4px;
        transition: width 0.5s ease;
    }
    #affection-value {
        min-width: 26px;
        text-align: right;
        font-weight: bold;
    }
    </style>
</head>
<body>
    <div id="chat-bubble"></div>
    <!-- 好感度条 -->
    <div id="affection-bar">
        <span id="affection-icon">💗</span>
        <div id="affection-track">
            <div id="affection-fill"></div>
        </div>
        <span id="affection-value">20</span>
    </div>
    <!-- 添加输入框 -->
    <input id="chat-input" type="text" placeholder="在这里打字聊天..." style="
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        width: 300px; padding: 10px; border-radius: 20px; border: 1px solid #ccc;
        background: rgba(255,255,255,0.9); outline: none; z-index: 100;
    ">
    <!-- 引入必要的库 -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "./lib/three.module.js",
                "three/addons/": "./lib/addons/",
                "@pixiv/three-vrm": "./lib/three-vrm.module.min.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
